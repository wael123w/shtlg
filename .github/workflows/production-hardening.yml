name: Production hardening

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unsafe defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Database: require explicit environment configuration.
          p = Path('server/db.ts')
          s = p.read_text()
          old = """      const host = process.env.DB_HOST || '127.0.0.1';
      const port = Number(process.env.DB_PORT) || 3306;
      const database = process.env.DB_DATABASE || 'tapempire';
      const user = process.env.DB_USERNAME || 'tap_user';
      const password = process.env.DB_PASSWORD || '';"""
          new = """      const required = ['DB_HOST', 'DB_DATABASE', 'DB_USERNAME', 'DB_PASSWORD'].filter((key) => !process.env[key]?.trim());
      if (required.length > 0) {
        throw new Error(`Database configuration is incomplete. Missing: ${required.join(', ')}`);
      }
      const host = process.env.DB_HOST!.trim();
      const port = Number(process.env.DB_PORT) || 3306;
      const database = process.env.DB_DATABASE!.trim();
      const user = process.env.DB_USERNAME!.trim();
      const password = process.env.DB_PASSWORD!;"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Admin login: never ship a password in the browser bundle.
          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text()
          s = s.replace("const [loginPassword, setLoginPassword] = useState('SuperAdminPass2026!');", "const [loginPassword, setLoginPassword] = useState('');")
          s = s.replace("const txHash = prompt('Enter Blockchain / Payout Transaction Hash:', '0x' + Math.random().toString(16).substring(2, 22));", "const txHash = prompt('Enter the real blockchain payout transaction hash:');")
          s = re.sub(r"\n\s*<div className=\"pt-3 border-t border-white/10 text-\[10px\] text-slate-400 space-y-1\">\n\s*<p className=\"font-semibold text-slate-300\">Default Credentials:</p>\n\s*<p className=\"font-mono text-cyan-400/90\">Username:.*?</p>\n\s*<p className=\"font-mono text-cyan-400/90\">Or Moderator:.*?</p>\n\s*</div>", "", s, count=1, flags=re.S)
          p.write_text(s)

          # Installer: fields start empty; only non-secret branding defaults remain.
          p = Path('src/components/WebInstaller.tsx')
          s = p.read_text()
          replacements = {
              "db_host: 'localhost'": "db_host: ''",
              "db_name: 'tapempire_db'": "db_name: ''",
              "db_user: 'cpanel_user'": "db_user: ''",
              "db_pass: 'StrongPassword123!'": "db_pass: ''",
              "telegram_bot_token: '123456789:ABCdefGhIJKlmNoPQRstuVWXyz'": "telegram_bot_token: ''",
              "telegram_bot_username: 'TapEmpireGameBot'": "telegram_bot_username: ''",
              "admin_username: 'admin'": "admin_username: ''",
              "admin_email: 'admin@tapempire.io'": "admin_email: ''",
              "admin_password: 'SuperSecretAdminPass123!'": "admin_password: ''",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          # CJS deployment build: use process.cwd() instead of import.meta.
          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("import { fileURLToPath } from 'url';\n", "")
          s = s.replace("const __filename = fileURLToPath(import.meta.url);\nconst __dirname = path.dirname(__filename);\n\n", "")
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts src/components/AdminDashboard.tsx src/components/WebInstaller.tsx server.ts
          if git diff --cached --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git commit -m 'fix: remove unsafe production defaults'
          git push origin HEAD:main
