name: Build cPanel Production Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/db.ts')
          s = p.read_text()
          s = re.sub(
              r"const host = process\.env\.DB_HOST \|\| '127\.0\.0\.1';\n\s*const port = Number\(process\.env\.DB_PORT\) \|\| 3306;\n\s*const database = process\.env\.DB_DATABASE \|\| 'tapempire';\n\s*const user = process\.env\.DB_USERNAME \|\| 'tap_user';\n\s*const password = process\.env\.DB_PASSWORD \|\| '';",
              "const required = ['DB_HOST', 'DB_DATABASE', 'DB_USERNAME', 'DB_PASSWORD'].filter((key) => !process.env[key]?.trim());\n      if (required.length > 0) throw new Error(`Database configuration is incomplete. Missing: ${required.join(', ')}`);\n      const host = process.env.DB_HOST!.trim();\n      const port = Number(process.env.DB_PORT) || 3306;\n      const database = process.env.DB_DATABASE!.trim();\n      const user = process.env.DB_USERNAME!.trim();\n      const password = process.env.DB_PASSWORD!;",
              s,
              count=1,
          )
          p.write_text(s)

          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text()
          s = s.replace("useState('superadmin')", "useState('')")
          s = s.replace("useState('SuperAdminPass2026!')", "useState('')")
          s = s.replace('placeholder="superadmin"', 'placeholder="Admin username or email"')
          s = s.replace("const txHash = prompt('Enter Blockchain / Payout Transaction Hash:', '0x' + Math.random().toString(16).substring(2, 22));", "const txHash = prompt('Enter Blockchain / Payout Transaction Hash:');")
          p.write_text(s)

          p = Path('src/components/WebInstaller.tsx')
          s = p.read_text()
          for old, new in {
              "db_host: 'localhost'": "db_host: ''",
              "db_name: 'tapempire_db'": "db_name: ''",
              "db_user: 'cpanel_user'": "db_user: ''",
              "db_pass: 'StrongPassword123!'": "db_pass: ''",
              "telegram_bot_token: '123456789:ABCdefGhIJKlmNoPQRstuVWXyz'": "telegram_bot_token: ''",
              "telegram_bot_username: 'TapEmpireGameBot'": "telegram_bot_username: ''",
              "admin_username: 'admin'": "admin_username: ''",
              "admin_email: 'admin@tapempire.io'": "admin_email: ''",
              "admin_password: 'SuperSecretAdminPass123!'": "admin_password: ''",
          }.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("import { fileURLToPath } from 'url';\n", '')
          s = s.replace("const __filename = fileURLToPath(import.meta.url);\nconst __dirname = path.dirname(__filename);\n\n", '')
          p.write_text(s)
          PY

      - name: Type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Create cPanel package
        run: |
          set -euo pipefail
          rm -rf release tap-empire-cpanel-production.zip
          mkdir -p release
          cp -R dist release/dist
          cp -R server release/server
          cp package.json release/package.json
          [ -f package-lock.json ] && cp package-lock.json release/package-lock.json || true
          [ -f .env.example ] && cp .env.example release/.env.example || true
          [ -f README.md ] && cp README.md release/README.md || true
          cp -R node_modules release/node_modules
          printf '%s\n' 'Startup file: dist/server.cjs' 'Production package - dependencies included; do not run npm install on hosting.' 'Configure DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, ADMIN_JWT_SECRET and USER_AUTH_SECRET in cPanel.' 'Then restart the Node.js application and open /install.' > release/START.txt
          cd release
          zip -qr ../tap-empire-cpanel-production.zip .
          cd ..
          test -s tap-empire-cpanel-production.zip
          unzip -l tap-empire-cpanel-production.zip | grep -q 'dist/server.cjs'

      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tap-empire-cpanel-production
          path: tap-empire-cpanel-production.zip
          if-no-files-found: error
          retention-days: 14
