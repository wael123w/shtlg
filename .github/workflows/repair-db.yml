name: Repair database engine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-db.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete db.ts from verified source commit
        run: |
          set -euo pipefail
          git show d2a7907313a5eecd705fbbe8db4f89a56f1ce7b8:server/db.ts > server/db.ts
          test "$(wc -c < server/db.ts)" -gt 50000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts
          git commit -m "repair: restore complete database engine"
          git push origin HEAD:main
